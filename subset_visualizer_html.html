<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subset Product Algorithm Visualizer</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Play = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
        );

        const Pause = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
        );

        const RotateCcw = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="1 4 1 10 7 10"></polyline>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
        );

        const ChevronRight = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        );

        const ChevronLeft = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        );

        const SubsetProductVisualizer = () => {
            const arr = [2, 3, 4, 6];
            const K = 12;
            
            const [step, setStep] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            
            const generateSteps = () => {
                const steps = [];
                const dp = [{ 1: true }];
                
                steps.push({
                    phase: 'init',
                    description: 'Initialize: Array = [2, 3, 4, 6], Target K = 12',
                    arr, K,
                    dp: [{ 1: true }],
                    i: 0,
                    currentElement: null,
                    highlight: null,
                    code: 'dp[0][1] = true; // Base case: empty subset has product 1'
                });
                
                for (let i = 1; i <= arr.length; i++) {
                    dp[i] = { ...dp[i - 1] };
                    steps.push({
                        phase: 'dp-build',
                        description: `Step ${i}: Copy all products from dp[${i-1}] to dp[${i}]`,
                        arr, K,
                        dp: [...dp],
                        i,
                        currentElement: arr[i - 1],
                        highlight: 'copy',
                        code: `dp[${i}] = dp[${i-1}]; // Start with previous products`
                    });
                    
                    const prevProds = Object.keys(dp[i - 1]).map(Number);
                    for (const prod of prevProds) {
                        const newProd = prod * arr[i - 1];
                        if (newProd <= K) {
                            dp[i][newProd] = true;
                            steps.push({
                                phase: 'dp-build',
                                description: `Multiply ${prod} × ${arr[i-1]} = ${newProd}. ${newProd <= K ? 'Add to dp[' + i + ']' : 'Too large, skip'}`,
                                arr, K,
                                dp: [...dp],
                                i,
                                currentElement: arr[i - 1],
                                highlight: 'multiply',
                                oldProd: prod,
                                newProd,
                                code: `newProd = ${prod} * ${arr[i-1]} = ${newProd}\ndp[${i}][${newProd}] = true`
                            });
                        }
                    }
                }
                
                if (!dp[arr.length][K]) {
                    steps.push({
                        phase: 'check',
                        description: `Target ${K} NOT found in dp[${arr.length}]. No solution exists.`,
                        arr, K,
                        dp: [...dp],
                        result: [],
                        code: `if (!dp[n][K]) return {}; // No subset found`
                    });
                    return steps;
                }
                
                steps.push({
                    phase: 'check',
                    description: `✓ Target ${K} found in dp[${arr.length}]! Now backtrack to find subset.`,
                    arr, K,
                    dp: [...dp],
                    highlight: 'found',
                    code: `dp[${arr.length}][${K}] = true // Solution exists!`
                });
                
                const res = [];
                let i = arr.length;
                let target = K;
                
                while (i > 0 && target >= 1) {
                    if (dp[i - 1][target]) {
                        steps.push({
                            phase: 'backtrack',
                            description: `Backtrack i=${i}, target=${target}: Found ${target} in dp[${i-1}], so arr[${i-1}]=${arr[i-1]} NOT used`,
                            arr, K,
                            dp: [...dp],
                            i,
                            target,
                            result: [...res],
                            highlight: 'skip',
                            code: `if (dp[${i-1}].count(${target})) { i--; } // Skip element`
                        });
                        i--;
                    } else if (target % arr[i - 1] === 0 && dp[i - 1][target / arr[i - 1]]) {
                        res.push(arr[i - 1]);
                        const oldTarget = target;
                        target = target / arr[i - 1];
                        steps.push({
                            phase: 'backtrack',
                            description: `Backtrack i=${i}, target=${oldTarget}: arr[${i-1}]=${arr[i-1]} WAS used! New target = ${oldTarget}/${arr[i-1]} = ${target}`,
                            arr, K,
                            dp: [...dp],
                            i,
                            target: oldTarget,
                            newTarget: target,
                            result: [...res],
                            highlight: 'use',
                            code: `res.push(${arr[i-1]});\ntarget = ${oldTarget} / ${arr[i-1]} = ${target};`
                        });
                        i--;
                    }
                }
                
                res.reverse();
                steps.push({
                    phase: 'complete',
                    description: `Complete! Subset found: [${res.join(', ')}]. Product: ${res.reduce((a, b) => a * b, 1)}`,
                    arr, K,
                    dp: [...dp],
                    result: res,
                    code: `reverse(res); // Final subset: [${res.join(', ')}]`
                });
                
                return steps;
            };
            
            const steps = generateSteps();
            const currentStep = steps[step];
            
            useEffect(() => {
                let timer;
                if (isPlaying && step < steps.length - 1) {
                    timer = setTimeout(() => setStep(s => s + 1), 1500);
                } else if (step >= steps.length - 1) {
                    setIsPlaying(false);
                }
                return () => clearTimeout(timer);
            }, [isPlaying, step, steps.length]);
            
            const getPhaseColor = (phase) => {
                switch(phase) {
                    case 'init': return 'bg-blue-100 border-blue-300';
                    case 'dp-build': return 'bg-green-100 border-green-300';
                    case 'check': return 'bg-yellow-100 border-yellow-300';
                    case 'backtrack': return 'bg-purple-100 border-purple-300';
                    case 'complete': return 'bg-emerald-100 border-emerald-300';
                    default: return 'bg-gray-100 border-gray-300';
                }
            };
            
            return (
                <div className="w-full min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 p-6">
                    <div className="max-w-7xl mx-auto">
                        <h1 className="text-3xl font-bold text-slate-800 mb-2">Subset Product Algorithm Visualizer</h1>
                        <p className="text-slate-600 mb-6">Watch how Dynamic Programming finds a subset with product = K</p>
                        
                        <div className="bg-white rounded-lg shadow-md p-4 mb-6 flex flex-wrap items-center gap-4">
                            <button
                                onClick={() => setIsPlaying(!isPlaying)}
                                className="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 flex items-center gap-2"
                            >
                                {isPlaying ? <Pause size={20} /> : <Play size={20} />}
                                {isPlaying ? 'Pause' : 'Play'}
                            </button>
                            <button
                                onClick={() => { setStep(0); setIsPlaying(false); }}
                                className="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 flex items-center gap-2"
                            >
                                <RotateCcw size={20} /> Reset
                            </button>
                            <button
                                onClick={() => setStep(Math.max(0, step - 1))}
                                disabled={step === 0}
                                className="px-4 py-2 bg-slate-300 text-slate-700 rounded-lg hover:bg-slate-400 disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                <ChevronLeft size={20} />
                            </button>
                            <button
                                onClick={() => setStep(Math.min(steps.length - 1, step + 1))}
                                disabled={step === steps.length - 1}
                                className="px-4 py-2 bg-slate-300 text-slate-700 rounded-lg hover:bg-slate-400 disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                <ChevronRight size={20} />
                            </button>
                            <div className="ml-auto text-slate-600 font-mono">
                                Step {step + 1} / {steps.length}
                            </div>
                        </div>
                        
                        <div className={`${getPhaseColor(currentStep.phase)} border-2 rounded-lg p-4 mb-6`}>
                            <div className="font-bold text-lg mb-2 uppercase text-slate-700">
                                {currentStep.phase.replace('-', ' ')}
                            </div>
                            <div className="text-slate-800 text-lg">{currentStep.description}</div>
                        </div>
                        
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div className="space-y-6">
                                <div className="bg-white rounded-lg shadow-md p-6">
                                    <h3 className="text-xl font-bold mb-4 text-slate-700">Input Array</h3>
                                    <div className="flex gap-2 flex-wrap">
                                        {arr.map((val, idx) => (
                                            <div
                                                key={idx}
                                                className={`w-16 h-16 flex items-center justify-center text-xl font-bold rounded-lg border-2 transition-all ${
                                                    currentStep.currentElement === val && currentStep.phase === 'dp-build'
                                                        ? 'bg-green-300 border-green-500 scale-110'
                                                        : currentStep.result?.includes(val)
                                                        ? 'bg-emerald-300 border-emerald-500'
                                                        : 'bg-slate-100 border-slate-300'
                                                }`}
                                            >
                                                {val}
                                            </div>
                                        ))}
                                    </div>
                                    <div className="mt-4 text-slate-600">
                                        Target K = <span className="font-bold text-2xl text-blue-600">{K}</span>
                                    </div>
                                </div>
                                
                                <div className="bg-white rounded-lg shadow-md p-6">
                                    <h3 className="text-xl font-bold mb-4 text-slate-700">DP Table (Possible Products)</h3>
                                    <div className="space-y-2 max-h-96 overflow-y-auto">
                                        {currentStep.dp.map((products, idx) => (
                                            <div key={idx} className="flex items-start gap-2">
                                                <div className={`font-bold min-w-16 px-3 py-2 rounded ${
                                                    idx === currentStep.i ? 'bg-blue-200' : 'bg-slate-200'
                                                }`}>
                                                    dp[{idx}]
                                                </div>
                                                <div className="flex flex-wrap gap-1">
                                                    {Object.keys(products).map(prod => (
                                                        <span
                                                            key={prod}
                                                            className={`px-2 py-1 rounded text-sm font-mono ${
                                                                parseInt(prod) === K && idx === arr.length
                                                                    ? 'bg-yellow-300 border-2 border-yellow-500'
                                                                    : parseInt(prod) === currentStep.newProd && currentStep.highlight === 'multiply'
                                                                    ? 'bg-green-300 border-2 border-green-500'
                                                                    : parseInt(prod) === currentStep.target && currentStep.phase === 'backtrack'
                                                                    ? 'bg-purple-300 border-2 border-purple-500'
                                                                    : 'bg-blue-100'
                                                            }`}
                                                        >
                                                            {prod}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                            
                            <div className="space-y-6">
                                <div className="bg-slate-800 rounded-lg shadow-md p-6 text-green-400 font-mono">
                                    <h3 className="text-xl font-bold mb-4 text-white">Code Execution</h3>
                                    <pre className="text-sm whitespace-pre-wrap">{currentStep.code}</pre>
                                </div>
                                
                                <div className="bg-white rounded-lg shadow-md p-6">
                                    <h3 className="text-xl font-bold mb-4 text-slate-700">Current State</h3>
                                    <div className="space-y-2 text-slate-700">
                                        {currentStep.i !== undefined && (
                                            <div>Current Index (i): <span className="font-bold">{currentStep.i}</span></div>
                                        )}
                                        {currentStep.currentElement && (
                                            <div>Current Element: <span className="font-bold">{currentStep.currentElement}</span></div>
                                        )}
                                        {currentStep.target !== undefined && (
                                            <div>Target Product: <span className="font-bold">{currentStep.target}</span></div>
                                        )}
                                        {currentStep.oldProd && (
                                            <div>
                                                Calculation: <span className="font-bold">{currentStep.oldProd} × {currentStep.currentElement} = {currentStep.newProd}</span>
                                            </div>
                                        )}
                                    </div>
                                </div>
                                
                                {currentStep.result && (
                                    <div className="bg-emerald-50 border-2 border-emerald-300 rounded-lg shadow-md p-6">
                                        <h3 className="text-xl font-bold mb-4 text-emerald-700">Subset Found!</h3>
                                        <div className="flex gap-2 mb-4 flex-wrap">
                                            {currentStep.result.map((val, idx) => (
                                                <div
                                                    key={idx}
                                                    className="w-16 h-16 flex items-center justify-center text-xl font-bold rounded-lg bg-emerald-300 border-2 border-emerald-500"
                                                >
                                                    {val}
                                                </div>
                                            ))}
                                        </div>
                                        {currentStep.result.length > 0 && (
                                            <div className="text-slate-700">
                                                Product: {currentStep.result.join(' × ')} = <span className="font-bold text-2xl text-emerald-600">
                                                    {currentStep.result.reduce((a, b) => a * b, 1)}
                                                </span>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SubsetProductVisualizer />);
    </script>
</body>
</html>
